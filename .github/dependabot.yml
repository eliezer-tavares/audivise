# Atualizações semanais: dependências npm (raiz), GitHub Actions e crates
# do motor Rust. Agrupamento por ecossistema para não poluir os PRs.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-menor-patch:
        update-types: ['patch', 'minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
