<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audivise - Framing Assistant / Assistente de Enquadramento</title>

    <!-- MediaPipe Libraries / Bibliotecas MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"
        crossorigin="anonymous"></script>

    <style>
        /* Modern and accessible UI / Interface moderna e acessível */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        #inputVideo {
            width: 100%;
            max-width: 480px;
            height: auto;
            border-radius: 16px;
            border: 4px solid #007bff;
            margin: 20px 0;
            background-color: #000;
            /* Mirror effect for better user experience / Efeito espelho para melhor experiência */
            transform: scaleX(-1);
        }

        button {
            font-size: 22px;
            padding: 18px 30px;
            border-radius: 12px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            width: 95%;
            max-width: 450px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #0056b3;
        }

        .status {
            font-size: 22px;
            margin: 15px 0;
            min-height: 60px;
            font-weight: 500;
        }

        .device-info {
            font-size: 18px;
            color: #aaaaaa;
            margin-bottom: 5px;
        }

        /* Helper class for hidden elements / Classe auxiliar para elementos ocultos */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>

<body>
    <main>
        <!-- Accessibility: aria-live ensures screen readers announce status changes -->
        <!-- Acessibilidade: aria-live garante que leitores de tela anunciem mudanças de status -->
        <h1 id="statusText" aria-live="assertive" role="status">
            Pronto para iniciar. / Ready to start.
        </h1>

        <div id="deviceInfo" class="device-info" aria-live="polite"></div>

        <!-- Video element is now visible / Elemento de vídeo agora está visível -->
        <video id="inputVideo" playsinline autoplay muted></video>

        <br>

        <button id="startBtn" aria-label="Iniciar ou parar o assistente / Start or stop the assistant">
            Iniciar Assistente / Start Assistant
        </button>

        <button id="notebookBtn" aria-label="Alternar modo de câmera / Toggle camera mode">
            Modo Notebook / Laptop Mode
        </button>
    </main>

    <script>
        const videoElement = document.getElementById('inputVideo');
        const startBtn = document.getElementById('startBtn');
        const notebookBtn = document.getElementById('notebookBtn');
        const statusText = document.getElementById('statusText');
        const deviceInfo = document.getElementById('deviceInfo');

        let assistenteAtivo = false;
        let lastAnalysisTime = 0;
        let isSpeaking = false;
        let facingMode = 'user'; // 'user' = Front/Frontal | 'environment' = Rear/Traseira

        // === DEVICE DETECTION / DETECÇÃO DE DISPOSITIVO ===
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        deviceInfo.textContent = isMobile
            ? "Detectado: Celular / Mobile Detected"
            : "Detectado: Computador (Webcam) / PC Detected";

        // === SPEECH SYNTHESIS / SÍNTESE DE VOZ (VUI) ===
        function falar(texto) {
            if (isSpeaking) return;
            isSpeaking = true;
            statusText.innerText = texto;

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR'; // Default to PT-BR / Padrão para Português
            utterance.rate = 1.0;
            utterance.onend = () => isSpeaking = false;
            window.speechSynthesis.speak(utterance);
        }

        // === BACKEND COMMUNICATION (RUST) / COMUNICAÇÃO COM BACKEND ===
        async function enviarParaRust(faceData) {
            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(faceData)
                });
                const data = await res.json();

                // If the assistant is active, announce the guidance from Rust
                // Se o assistente estiver ativo, anuncia a orientação vinda do Rust
                if (data.message && assistenteAtivo) {
                    falar(data.message);
                }
            } catch (e) {
                console.error("Connection Error:", e);
            }
        }

        // === MEDIAPIPE FACE DETECTION / DETECÇÃO FACIAL ===
        const faceDetection = new FaceDetection({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
        });

        faceDetection.setOptions({
            minDetectionConfidence: 0.6,
            model: 'short' // Optimized for front-facing / Otimizado para selfie
        });

        faceDetection.onResults(results => {
            // Logic to prevent voice overlap and flood / Lógica para evitar sobreposição de voz
            if (!assistenteAtivo || Date.now() - lastAnalysisTime < 2500 || isSpeaking) return;

            if (results.detections && results.detections.length > 0) {
                lastAnalysisTime = Date.now();
                const face = results.detections[0].boundingBox;

                // Send coordinates to Rust for analysis
                // Envia coordenadas para o Rust para análise
                enviarParaRust({
                    x_center: face.xCenter,
                    y_center: face.yCenter,
                    width: face.width,
                    height: face.height
                });
            }
        });

        // === CAMERA CONTROL / CONTROLE DA CÂMERA ===
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (assistenteAtivo) {
                    await faceDetection.send({ image: videoElement });
                }
            },
            width: 640,
            height: 480,
            facingMode: facingMode
        });

        // === EVENT LISTENERS / INTERAÇÃO DO USUÁRIO ===

        // Toggle Assistant / Iniciar-Parar Assistente
        startBtn.addEventListener('click', () => {
            assistenteAtivo = !assistenteAtivo;
            startBtn.innerText = assistenteAtivo
                ? "Parar Assistente / Stop Assistant"
                : "Iniciar Assistente / Start Assistant";

            if (assistenteAtivo) {
                camera.start()
                    .then(() => falar("Câmera ligada. Analisando rosto. / Camera on. Analyzing face."))
                    .catch(() => falar("Erro ao acessar câmera. / Camera access error."));
            } else {
                camera.stop();
                falar("Assistente interrompido. / Assistant stopped.");
            }
        });

        // Toggle Camera Mode / Alternar Modo de Câmera
        notebookBtn.addEventListener('click', () => {
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            const modoTexto = (facingMode === 'user') ? "Frontal" : "Notebook/Traseira";

            falar(`Modo de câmera alterado para ${modoTexto}. / Camera mode changed.`);
            deviceInfo.textContent = `Modo atual / Current mode: ${modoTexto}`;
        });
    </script>
</body>

</html>
