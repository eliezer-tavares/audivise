[package]
name = "audivise_engine"
version = "1.0.0"
edition = "2021"
description = "Motor geométrico de enquadramento do Audivise, compilado para WebAssembly. Arquitetado por Eliezer Tavares de Oliveira."
license = "GPL-3.0-or-later"
repository = "https://github.com/eliezer-tavares/audivise"
keywords = ["accessibility", "wasm", "framing", "assistive"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# Fixado em 0.2.130 em lockstep com o wasm-bindgen 0.2.130 do [dependencies] e
# com o wasm-bindgen-test-runner 0.2.130 instalado no CI — o protocolo entre a
# crate de teste e o runner precisa ser idêntico.
wasm-bindgen-test = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
