[package]
name = "audivise_engine"
version = "1.0.0"
edition = "2021"
description = "Motor geométrico de enquadramento do Audivise, compilado para WebAssembly. Arquitetado por Eliezer Tavares de Oliveira."
license = "GPL-3.0-or-later"
repository = "https://github.com/eliezer-tavares/audivise"
keywords = ["accessibility", "wasm", "framing", "assistive"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]

# wasm-bindgen-test usa numeracao propria (linha 0.3.x): a versao 0.3.80
# exige exatamente a wasm-bindgen 0.2.130 e fala o mesmo protocolo do
# runner 0.2.130 instalado no CI (via wasm-bindgen-test-shared 0.2.130).
wasm-bindgen-test = "=0.3.80"
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
